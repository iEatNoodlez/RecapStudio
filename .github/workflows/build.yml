# Builds Recap Studio's release files: for Windows, the installer and the portable zip of each edition, Lite and
# Full Suite (packaging/build.ps1); for Linux, an AppImage of each (packaging/linux/build.sh). Push a tag like v1.0.0
# to publish the six files as a GitHub release; run it by hand (Actions → Build → Run workflow) to get them as the
# run's artifacts instead.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version in the file names (default: 0.0.0-<commit>)"
        required: false

permissions:
  contents: write  # to create the release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then v="${REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"
          else v="0.0.0-${SHA:0:7}"; fi
          if ! [[ "$v" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "Version '$v' can only have letters, digits, dots and dashes."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build Lite
        shell: pwsh
        run: ./packaging/build.ps1 -Version "${{ needs.version.outputs.version }}" -Edition lite

      - name: Build Full Suite
        shell: pwsh
        run: ./packaging/build.ps1 -Version "${{ needs.version.outputs.version }}" -Edition full

      - uses: actions/upload-artifact@v4
        with:
          name: recap-studio-${{ needs.version.outputs.version }}-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          compression-level: 0  # already compressed

  linux:
    needs: version
    # the oldest Ubuntu GitHub runs: the AppImages need a glibc at least as new as the one they're built with
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Qt's X libraries (they go inside the AppImages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxkbcommon-x11-0

      - name: Build Lite
        run: bash packaging/linux/build.sh "${{ needs.version.outputs.version }}" lite

      - name: Build Full Suite
        run: bash packaging/linux/build.sh "${{ needs.version.outputs.version }}" full

      - uses: actions/upload-artifact@v4
        with:
          name: recap-studio-${{ needs.version.outputs.version }}-linux
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0  # already compressed

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.zip dist/*.AppImage)
          if [ "${#files[@]}" -ne 6 ]; then
            echo "Expected six files (Lite's and Full Suite's, for Windows and Linux), found ${#files[@]}."; exit 1
          fi
          # which file is which, above GitHub's list of changes
          sed "s/{version}/$VERSION/g" packaging/release-notes.md > notes.md
          gh release create "$TAG" "${files[@]}" --title "Recap Studio $VERSION" --notes-file notes.md --generate-notes
