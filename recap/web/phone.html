<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recap Studio</title>
<link rel="icon" href="icon.ico">
<style>
:root {
  --bg: #f3f3f0; --panel: #ffffff; --text: #1b1b1f; --muted: #6b6b70; --line: #dddcd6;
  --accent: #3d63dd; --accent-soft: #eef2fd; --accent-line: #c9d4f3; --accent-text: #ffffff;
  --danger: #c4372b; --warn: #95600f; --warn-soft: #fff8ea; --warn-line: #e7cfa3; --ok: #2f7a3a; --ok-line: #b7d6bd;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18181a; --panel: #222225; --text: #ececea; --muted: #9b9a95; --line: #34343a;
    --accent: #6d8cf0; --accent-soft: #232a40; --accent-line: #3a4670; --accent-text: #0f1220;
    --danger: #ec6a5f; --warn: #e0a84a; --warn-soft: #2e2719; --warn-line: #5a4a22; --ok: #74c37f; --ok-line: #2f5a3a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
header { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; }
header svg { flex: none; }
header h1 { font-size: 18px; font-weight: 600; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#back { font-size: 26px; line-height: 1; padding: 2px 12px 6px; min-height: 40px; }
#when { color: var(--ok); font-size: 12px; border: 1px solid var(--ok-line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
#when.off { color: var(--danger); border-color: var(--danger); }
main { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.card.link { cursor: pointer; }
.card.link:active { border-color: var(--accent); }
.card.running { border-color: var(--accent-line); background: var(--accent-soft); }
.card.paused { border-color: var(--warn-line); background: var(--warn-soft); }
.card h2 { font-size: 16px; font-weight: 600; margin: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row button { flex: 1; }
.muted { color: var(--muted); font-size: 14px; }
.state { font-size: 15px; overflow-wrap: anywhere; }
.state.running { color: var(--accent); }
.state.paused { color: var(--warn); }
.state.stopped { color: var(--danger); }
.state.done { color: var(--ok); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.card.running .bar { background: var(--accent-line); }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width 0.4s; }
button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 10px 16px; min-height: 44px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.danger { color: var(--danger); }
button:disabled { opacity: 0.5; }
.note { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.error { font-size: 14px; color: var(--danger); overflow-wrap: anywhere; }
.chapters { display: flex; flex-direction: column; }
.chapter { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.chapter:first-child { border-top: 0; }
.chapter span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 13px; white-space: nowrap; }
.pill.todo, .pill.new { color: var(--warn); }
.pill.ready { color: var(--accent); }
.pill.done { color: var(--ok); }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; min-height: 44px; }
.toggle input { width: 24px; height: 24px; flex: none; }
img.thumb { width: 100%; border-radius: 8px; display: block; }
video { width: 100%; border-radius: 8px; background: #000; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.section-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 2px 0; }
#new-btn { font-size: 14px; min-height: 40px; padding: 6px 12px; }
button.ghost { background: transparent; }
button.on { border-color: var(--accent); color: var(--accent); }
/* the list's rows: a cover, the name and state, a button */
.row-card { flex-direction: row; align-items: center; gap: 12px; }
.row-thumb { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; object-position: top; background: var(--line); flex: none; display: block; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-text h2 { overflow: hidden; text-overflow: ellipsis; }
.row-text .state { font-size: 14px; }
.muted.small { font-size: 13px; }
.row-btn { flex: none; min-height: 40px; padding: 6px 14px; font-size: 15px; }
/* forms: a new project, a name to give, a search */
.field { font: inherit; width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--panel); color: var(--text); }
.row .field { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.stack .field, .stack .chips { color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 15px; }
.chip.on { border-color: var(--accent); color: var(--accent); }
.chip input { margin: 0; }
/* the people the scan found */
.review .group { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.snaps { display: flex; gap: 6px; overflow-x: auto; }
.snaps img { height: 96px; width: auto; border-radius: 6px; flex: none; background: var(--line); }
.small-toggle { align-self: flex-start; min-height: 36px; padding: 6px 12px; font-size: 14px; }
/* chapters from a site */
.results { display: flex; flex-direction: column; gap: 6px; }
.result { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; }
.result img, .result .nocover { width: 44px; height: 60px; object-fit: cover; border-radius: 4px; background: var(--line); flex: none; display: block; }
.picks { display: flex; flex-direction: column; }
.pick { display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid var(--line); font-size: 15px; }
.pick:first-child { border-top: 0; }
.pick input { width: 22px; height: 22px; flex: none; margin: 0; }
.pick-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <button id="back" hidden aria-label="All projects">‹</button>
  <svg width="26" height="26" viewBox="0 0 256 256" aria-hidden="true"><rect x="10" y="10" width="236" height="236" rx="49" fill="#3d63dd"></rect><path d="M42 66 Q86 54 128 80 V198 Q86 176 42 186 Z" fill="#ffffff"></path><path d="M214 66 Q170 54 128 80 V198 Q170 176 214 186 Z" fill="#eef1fd"></path><path d="M148 100 L194 130 L148 160 Z" fill="#304fc7"></path></svg>
  <h1 id="title">Recap Studio</h1>
  <button id="new-btn" type="button" title="A new project">+ New</button>
  <span id="when" title="When this page last heard from the PC"></span>
</header>
<main id="list"></main>
<main id="project" hidden></main>
<script src="phone.js"></script>
</body>
</html>
